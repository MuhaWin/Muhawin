<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" href="/simge.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Giriş · MuhaWin Denetim</title>
<script src="/tema.js"></script>
<link rel="stylesheet" href="/tema.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.kutu{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}.alt{color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
input{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:inherit;padding:0 10px;font:inherit}
button{width:100%;min-height:40px;border-radius:8px;border:0;background:var(--brand-2,#12B5A0);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.hata{color:#a3262c;font-size:13px;min-height:18px;margin:10px 0 0}
.not{color:var(--muted);font-size:12px;margin:16px 0 0}
</style>
</head>
<body>
<form class="kutu" id="form">
  <h1>MuhaWin Denetim</h1>
  <p class="alt">MuhaWin hesabınızla giriş yapın.</p>
  <label>E-posta<input type="email" id="eposta" autocomplete="username" required autofocus></label>
  <label>Parola<input type="password" id="parola" autocomplete="current-password" required></label>
  <button type="submit" id="gir">Giriş yap</button>
  <p class="hata" id="hata" role="alert"></p>
  <p class="not">Yalnız yetki verilmiş hesaplar girebilir. Parolanızı unuttuysanız MuhaWin programındaki giriş ekranından yenileyin.</p>
</form>
<script>
const $ = s => document.querySelector(s);
$("#form").onsubmit = async e => {
  e.preventDefault(); $("#hata").textContent = ""; $("#gir").disabled = true;
  try {
    const r = await fetch("/api/giris", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({eposta: $("#eposta").value, parola: $("#parola").value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Giriş yapılamadı.");
    location.replace("/denetim");
  } catch (x) { $("#hata").textContent = x.message; $("#parola").value = ""; $("#parola").focus(); }
  finally { $("#gir").disabled = false; }
};
</script>
</body>
</html>
