<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline'">
<title>MuhaWin</title>
<style>
/* MuhaWin görsel kimlik paketi: açılış ekranı (640×400, boş arka plan) + programın yazdığı durum, yüzde ve sürüm */
html,body{margin:0;width:640px;height:400px;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
body{background:#16325C -webkit-image-set(url(gorsel/acilis_arkaplan.png) 1x,url(gorsel/acilis_arkaplan@2x.png) 2x) center/640px 400px no-repeat;
  color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-app-region:drag}
.durum{position:absolute;left:48px;right:48px;top:313px;display:flex;justify-content:space-between;font-size:13px;color:#c9d5e6}
.durum b{font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:48px;right:48px;top:337px;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#12B5A0,#3FD9C4);transition:width .45s ease}
.surum{position:absolute;left:48px;top:364px;font-size:11.5px;color:#8ea2c2}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>
<body>
<div class="durum"><span id="d">Program başlatılıyor…</span><b id="y">%0</b></div>
<div class="bar" role="progressbar" aria-label="Yükleniyor" aria-valuemin="0" aria-valuemax="100"><i id="b"></i></div>
<div class="surum" id="v">Sürüm</div>
<script>
  const m = location.hash.match(/v=([\w.\-]+)/);
  document.getElementById('v').textContent = 'Sürüm ' + (m ? m[1] : '');
  // ana süreç çağırır: setDurum('Arayüz yükleniyor…', 40)
  window.setDurum = (metin, yuzde) => {
    if (metin) document.getElementById('d').textContent = metin;
    const p = Math.max(0, Math.min(100, yuzde | 0));
    document.getElementById('b').style.width = p + '%';
    document.getElementById('y').textContent = '%' + p;
    document.querySelector('.bar').setAttribute('aria-valuenow', p);
  };
  setDurum('Program başlatılıyor…', 8);
</script>
</body></html>
